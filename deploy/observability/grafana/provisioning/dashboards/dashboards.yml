# Points Grafana at deploy/observability/grafana/dashboards (mounted at
# /var/lib/grafana/dashboards in the container) so the JSON there is loaded on startup —
# the dashboard is code committed in the repo, not something clicked together by hand.
apiVersion: 1

providers:
  - name: myfinance
    orgId: 1
    folder: ""
    type: file
    disableDeletion: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
