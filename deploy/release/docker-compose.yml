# my-finance release stack: same topology as the repo's docker-compose.yml,
# but pulls prebuilt images from GHCR instead of building from source.
# The release workflow rewrites the image tags to the released version when
# packaging the bundle.
#
# The explicit project name keeps the data volume stable ("my-finance_postgres-data")
# no matter what the unzipped folder is called — without it, unzipping a new
# release into a differently named folder would start with an empty database.
name: my-finance

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myfinance}
      POSTGRES_USER: ${POSTGRES_USER:-myfinance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myfinance}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ghcr.io/noratans/my-finance-backend:latest
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-myfinance}
      DB_USERNAME: ${POSTGRES_USER:-myfinance}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-myfinance}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ANALYTICS_URL: http://analytics:8000
      ANALYTICS_TOKEN: ${ANALYTICS_TOKEN:-dev-analytics-token}
      DB_ANALYTICS_PASSWORD: ${DB_ANALYTICS_PASSWORD:-myfinance-ro}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # busybox wget from the alpine JRE base image (no curl there).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  analytics:
    image: ghcr.io/noratans/my-finance-analytics:latest
    restart: unless-stopped
    environment:
      # The read-only myfinance_ro role (docs/SCHEMA.md "The read-only analytics
      # role"), never the app's own credentials.
      DATABASE_URL: postgresql://myfinance_ro:${DB_ANALYTICS_PASSWORD:-myfinance-ro}@postgres:5432/${POSTGRES_DB:-myfinance}
      ANALYTICS_TOKEN: ${ANALYTICS_TOKEN:-dev-analytics-token}
      TZ: ${TZ:-UTC}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # No wget/curl in python:3.12-slim; the interpreter is the probe.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  frontend:
    image: ghcr.io/noratans/my-finance-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres-data:
