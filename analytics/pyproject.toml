[project]
name = "analytics"
version = "0.1.0"
description = "my-finance analytics service: a read-only executor for saved insight plans."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "mypy>=2.3",
    "pytest>=8.0",
    "ruff>=0.16.9",
    "testcontainers>=4.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# pycodestyle errors + pyflakes (ruff's default) plus import sorting,
# pyupgrade and bugbear — the three that catch real mistakes rather than taste.
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# The service's own package, so its imports sort into a block of their own
# instead of being mistaken for a third-party distribution named "analytics".
known-first-party = ["analytics"]

[tool.ruff.format]
# The codebase already uses double quotes; say so explicitly rather than
# relying on the default staying put across ruff versions.
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
files = ["src/analytics"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
