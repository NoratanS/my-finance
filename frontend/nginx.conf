# Production equivalent of the Vite dev proxy (vite.config.ts): the SPA and
# the API share one origin, so session + XSRF cookies stay first-party and no
# CORS configuration is needed (ARCHITECTURE.md §5).
server {
    listen 80;

    # Docker's embedded DNS server. nginx resolves a literal upstream hostname
    # exactly once, at startup, and then caches that address for the life of the
    # process — so every `docker compose up -d --build backend` handed the backend
    # a new container IP while this container kept proxying to the old, dead one,
    # 502ing every /api request until nginx happened to be restarted. Observed in
    # practice: signup failing while nginx held 172.19.0.3 and the backend had
    # moved to 172.19.0.6. Naming a resolver, and routing proxy_pass through a
    # variable (below), defers the lookup to request time and re-checks it every
    # 10s. ipv6=off because the compose network is v4-only; without it every
    # lookup also asks for an AAAA record that will never exist.
    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Backup restore uploads (POST /api/backup/restore) are up to 20 MB;
    # nginx's 1m default would reject them with 413 before the backend sees them.
    client_max_body_size 25m;

    location /api/ {
        # No trailing URI on proxy_pass: the request path is forwarded as-is,
        # and the backend serves everything under /api. That still holds in the
        # variable form — $backend_upstream carries scheme, host and port but no
        # path, and nginx rewrites the request URI only when proxy_pass itself
        # specifies one. Adding even a bare "/" here would replace /api/... with
        # the matched prefix stripped, and every route would 404. Cookies and
        # headers pass through untouched; keep Host as the browser sent it,
        # matching the dev proxy's changeOrigin: false.
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;
        # A max-size backup restore can legitimately take longer than nginx's
        # 60s default; a mid-restore 504 invites a retry that duplicates
        # profiles. Sized like client_max_body_size: generous, not infinite.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Without Cache-Control, browsers apply heuristic caching to index.html
    # (its mtime is the image build time), and a cached shell from a previous
    # image references hashed assets that no longer exist after an upgrade —
    # blank page until a hard refresh. Force revalidation; ETag keeps it cheap.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite's hashed bundles never change under the same name. No try_files
    # here: a missing asset must 404, not fall back to index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback: client-side routes like /transactions are handled by
    # React Router, so unknown paths serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
