name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: cd backend && ./mvnw -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Lint, test and build
        run: cd frontend && npm ci && npm run check:types && npm run lint && npm run format:check && npm test && npm run build

  analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.6'
          python-version: '3.12'
          enable-cache: true
          cache-dependency-glob: analytics/uv.lock
      - name: Lint, type-check and test
        # The executor's tests start a postgres:16-alpine container through
        # testcontainers-python and apply the backend's own migrations. GitHub's runners
        # ship a Docker daemon, so there is nothing to install — the same reasoning as the
        # backend's Testcontainers tests.
        run: cd analytics && uv run --locked ruff check . && uv run --locked ruff format --check . && uv run mypy && uv run --locked pytest -q

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the stack
        # The e2e overlay publishes the backend on 8080, which the Vite dev
        # server proxies to. Without it the suite stops at its first request.
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build
      - name: Wait for the backend
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/profiles || true)
            if [ "$code" = "200" ]; then echo "backend up"; exit 0; fi
            sleep 5
          done
          echo "backend never became ready"; docker compose logs backend; exit 1
      - name: Another site's page cannot reach or change the instance
        # Two refusals, checked through nginx, the stack's one published entry point.
        # nginx answers only to localhost or an address, which stops a DNS-rebinding
        # page (frontend/nginx.conf); and a form post from another origin, which
        # cannot carry X-Profile-Id, is refused by the backend (docs/API.md "Active
        # profile"). The frontend starts once the backend is healthy, hence the loop.
        run: |
          status() { curl -s -o /dev/null -w '%{http_code}' "$@" || true; }
          for i in $(seq 1 30); do
            code=$(status http://localhost:3000/api/profiles)
            if [ "$code" = "200" ]; then break; fi
            sleep 2
          done
          test "$code" = "200"
          test "$(status http://127.0.0.1:3000/api/profiles)" = "200"
          test "$(status -H 'Host: elsewhere.example' http://localhost:3000/api/profiles)" = "403"
          echo '{}' > /tmp/upload.json
          curl -s -H 'Origin: https://elsewhere.example' -F 'file=@/tmp/upload.json;type=application/json' \
            http://localhost:3000/api/backup/restore | grep -q '/errors/profile-header-missing'
      - name: Install and run Playwright
        run: cd frontend && npm ci && npx playwright install --with-deps chromium && npx playwright test
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
