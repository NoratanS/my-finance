# The fast check on every PR: lint, types and the specs the PR touches (checks.yml).
name: CI

on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

# A new push to the PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Its id prefixes the required-check names: `checks / api`, `checks / web`, ...
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      full: false
