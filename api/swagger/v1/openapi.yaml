---
openapi: 3.0.3
info:
  title: my-finance API
  version: v1
paths:
  "/api/account":
    patch:
      summary: 'Changes the signed-in user''s own settings: their ledger''s currency'
      tags:
      - Account
      operationId: updateAccount
      parameters: []
      responses:
        '200':
          description: currency changed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Session"
        '422':
          description: a currency the ledger can't use, or any change once the ledger
            has a transaction
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '400':
          description: the currency is missing, blank or not a string
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '401':
          description: no session
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                currency:
                  "$ref": "#/components/schemas/Currency"
              required:
              - currency
  "/api/health":
    get:
      summary: Checks that the API reaches the database
      tags:
      - Health
      operationId: getHealth
      responses:
        '200':
          description: the API and its database are up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                    - ok
                required:
                - status
                additionalProperties: false
  "/api/invites":
    get:
      summary: Lists pending invites (admin only)
      tags:
      - Invites
      operationId: listInvites
      responses:
        '200':
          description: unaccepted, unexpired invites, soonest expiry first
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Invite"
            application/problem+json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Invite"
        '401':
          description: no session
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '404':
          description: not the admin
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
    post:
      summary: Invites an email (admin only); the token is returned once
      tags:
      - Invites
      operationId: createInvite
      parameters: []
      responses:
        '201':
          description: invite created; build the link from its token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/CreatedInvite"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/CreatedInvite"
        '422':
          description: the email already has an account
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '401':
          description: no session
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '404':
          description: not the admin
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
              - email
  "/api/invites/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    delete:
      summary: Revokes a pending invite (admin only)
      tags:
      - Invites
      operationId: deleteInvite
      responses:
        '204':
          description: revoked; it leaves the pending list
        '404':
          description: no such invite, or not the admin
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '401':
          description: no session
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
  "/api/password_reset":
    get:
      summary: Shows whose password a reset link sets
      tags:
      - Password resets
      operationId: getPasswordReset
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: the email the link resets
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PasswordReset"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/PasswordReset"
        '404':
          description: 'an expired, used or unknown link: one dead-link state'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
    patch:
      summary: Sets a new password from a reset link, ends the user's sessions, and
        signs them in here
      tags:
      - Password resets
      operationId: updatePasswordReset
      parameters: []
      responses:
        '200':
          description: password set and signed in as that user; the session cookie
            is set
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Session"
        '422':
          description: the new password is invalid; the link still works
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '400':
          description: the password is missing, blank or not a string; the link still
            works
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '404':
          description: 'an expired, used or unknown link: one dead-link state'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '429':
          description: too many reset attempts from this address
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before trying again
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
              required:
              - token
              - password
  "/api/password":
    patch:
      summary: Changes the signed-in user's password; ends their other sessions and
        keeps this one
      tags:
      - Password
      operationId: updatePassword
      parameters: []
      responses:
        '200':
          description: password changed; this device stays signed in, every other
            session ends
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Session"
        '422':
          description: the current password is wrong; nothing changes
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '400':
          description: a field is missing, blank or not a string
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '401':
          description: no session
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '429':
          description: too many password changes from this address
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before trying again
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                password:
                  type: string
              required:
              - current_password
              - password
  "/api/users/{user_id}/reset_links":
    parameters:
    - name: user_id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: Creates a password reset link for a user (admin only); the token is
        returned once
      tags:
      - Users
      operationId: createResetLink
      responses:
        '201':
          description: link created; build it from the token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ResetLink"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/ResetLink"
        '404':
          description: no such user, or not the admin
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '401':
          description: no session
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
  "/api/session":
    get:
      summary: Returns the signed-in user
      tags:
      - Session
      operationId: getSession
      responses:
        '200':
          description: the signed-in user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Session"
        '401':
          description: no session
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
    post:
      summary: Signs in
      tags:
      - Session
      operationId: createSession
      parameters: []
      responses:
        '201':
          description: signed in; the session cookie is set
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Session"
        '401':
          description: wrong email or password, with one message for both
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '400':
          description: the password is missing, blank or not a string
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '429':
          description: too many sign-in attempts from this address
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before trying again
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                password:
                  type: string
              required:
              - email
              - password
    delete:
      summary: Signs out
      tags:
      - Session
      operationId: deleteSession
      responses:
        '204':
          description: signed out; the session no longer works
        '401':
          description: no session
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
  "/api/signup":
    get:
      summary: Shows the invite behind a signup link
      tags:
      - Signups
      operationId: getSignup
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: the invite's email, state and expiry
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Signup"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Signup"
        '404':
          description: unknown or revoked link
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
    post:
      summary: 'Accepts an invite: creates the user and signs them in'
      tags:
      - Signups
      operationId: createSignup
      parameters: []
      responses:
        '201':
          description: signed in as the new user; the session cookie is set
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Session"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Session"
        '422':
          description: invalid fields, or the invite expired or was used (the title
            says which)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '400':
          description: the password is missing, blank or not a string; the invite
            stays pending
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '429':
          description: too many signup attempts from this address
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before trying again
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '404':
          description: unknown or revoked link
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
                currency:
                  "$ref": "#/components/schemas/Currency"
              required:
              - token
              - password
              - currency
  "/api/tags":
    get:
      summary: Lists the signed-in user's tags A–Z, ignoring case
      tags:
      - Tags
      operationId: listTags
      responses:
        '200':
          description: only my tags, A–Z ignoring case
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TagList"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/TagList"
        '401':
          description: no session
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
    post:
      summary: Creates a tag in the signed-in user's set
      tags:
      - Tags
      operationId: createTag
      parameters: []
      responses:
        '201':
          description: created, the name trimmed and kept as typed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Tag"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Tag"
        '422':
          description: 'the name is taken: case and surrounding spaces don''t make
            a new tag'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TagInput"
  "/api/transaction_months":
    get:
      summary: Lists the months the signed-in user's transactions fall in, and this
        month, newest first
      tags:
      - Transactions
      operationId: listTransactionMonths
      responses:
        '200':
          description: months as YYYY-MM, newest first; this month (in Warsaw) even
            when it has none
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
            application/problem+json:
              schema:
                type: array
                items:
                  type: string
                  pattern: "^\\d{4}-(0[1-9]|1[0-2])$"
        '401':
          description: no session
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
  "/api/transactions":
    get:
      summary: Lists the signed-in user's transactions for a period, newest first,
        25 a page
      tags:
      - Transactions
      operationId: listTransactions
      parameters:
      - name: period
        in: query
        required: false
        schema:
          "$ref": "#/components/schemas/Period"
        description: A month as YYYY-MM, or all; this month in Warsaw when absent
      - name: q
        in: query
        required: false
        description: Matches descriptions, ignoring case and accents
        schema:
          type: string
      - name: kind
        in: query
        required: false
        schema:
          "$ref": "#/components/schemas/Kind"
        description: Both kinds when absent
      - name: page
        in: query
        required: false
        description: From 1; out of range shows the nearest page
        schema:
          type: integer
      responses:
        '200':
          description: this month's page, by date then entry, newest first
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/TransactionPage"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/TransactionPage"
        '400':
          description: the period isn't a month as YYYY-MM or all
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '401':
          description: no session
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
    post:
      summary: Records an expense or income in the signed-in user's ledger
      tags:
      - Transactions
      operationId: createTransaction
      parameters: []
      responses:
        '201':
          description: recorded
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Transaction"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Transaction"
        '422':
          description: 'a rule is broken: amount, kind, date or description'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '400':
          description: the amount is missing or not a whole number of minor units
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '401':
          description: no session
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TransactionInput"
  "/api/transactions/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    patch:
      summary: Replaces every field of one of the signed-in user's transactions
      tags:
      - Transactions
      operationId: updateTransaction
      parameters: []
      responses:
        '200':
          description: saved
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Transaction"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Transaction"
        '422':
          description: 'a rule is broken: amount, kind, date or description'
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '400':
          description: the amount is missing or not a whole number of minor units
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '401':
          description: no session
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '404':
          description: no such transaction, or another user's
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/TransactionInput"
    delete:
      summary: Deletes one of the signed-in user's transactions
      tags:
      - Transactions
      operationId: deleteTransaction
      responses:
        '204':
          description: deleted
        '401':
          description: no session
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '404':
          description: no such transaction, or another user's
          content:
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
  "/api/users":
    get:
      summary: Lists every user (admin only)
      tags:
      - Users
      operationId: listUsers
      responses:
        '200':
          description: every user, longest-standing first
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/User"
            application/problem+json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/User"
        '401':
          description: no session
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
        '404':
          description: not the admin
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Problem"
            application/problem+json:
              schema:
                "$ref": "#/components/schemas/Problem"
servers:
- url: "/"
components:
  schemas:
    Session:
      type: object
      properties:
        email:
          type: string
        admin:
          type: boolean
        currency:
          "$ref": "#/components/schemas/Currency"
        currency_locked:
          type: boolean
      required:
      - email
      - admin
      - currency
      - currency_locked
      additionalProperties: false
    Currency:
      type: string
      enum:
      - PLN
      - EUR
      - USD
      - GBP
      - CHF
    Kind:
      type: string
      enum:
      - expense
      - income
    Period:
      type: string
      pattern: "^(\\d{4}-(0[1-9]|1[0-2])|all)$"
    Transaction:
      type: object
      properties:
        id:
          type: integer
        amount:
          type: integer
        kind:
          "$ref": "#/components/schemas/Kind"
        date:
          type: string
          format: date
        description:
          type: string
      required:
      - id
      - amount
      - kind
      - date
      - description
      additionalProperties: false
    TransactionInput:
      type: object
      properties:
        amount:
          type: integer
          description: Minor units (grosze, cents), always positive
        kind:
          "$ref": "#/components/schemas/Kind"
        date:
          type: string
          format: date
        description:
          type: string
      required:
      - amount
      - kind
      - date
    TransactionPage:
      type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/components/schemas/Transaction"
        meta:
          type: object
          properties:
            page:
              type: integer
            total_pages:
              type: integer
            total_count:
              type: integer
            period:
              "$ref": "#/components/schemas/Period"
            totals:
              type: object
              properties:
                expense:
                  type: integer
                income:
                  type: integer
                net:
                  type: integer
              required:
              - expense
              - income
              - net
              additionalProperties: false
          required:
          - page
          - total_pages
          - total_count
          - period
          - totals
          additionalProperties: false
      required:
      - data
      - meta
      additionalProperties: false
    TagColour:
      type: string
      enum:
      - lavender
      - mint
      - sky
      - peach
      - rose
      - butter
      - lilac
      - seafoam
    Tag:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        colour:
          allOf:
          - "$ref": "#/components/schemas/TagColour"
          nullable: true
      required:
      - id
      - name
      - colour
      additionalProperties: false
    TagInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 40
        colour:
          allOf:
          - "$ref": "#/components/schemas/TagColour"
          nullable: true
      required:
      - name
      additionalProperties: false
    TagList:
      type: object
      properties:
        data:
          type: array
          items:
            "$ref": "#/components/schemas/Tag"
      required:
      - data
      additionalProperties: false
    Invite:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - expires_at
      additionalProperties: false
    CreatedInvite:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        expires_at:
          type: string
          format: date-time
        token:
          type: string
      required:
      - id
      - email
      - expires_at
      - token
      additionalProperties: false
    Signup:
      type: object
      properties:
        email:
          type: string
        status:
          type: string
          enum:
          - pending
          - expired
          - accepted
        expires_at:
          type: string
          format: date-time
      required:
      - email
      - status
      - expires_at
      additionalProperties: false
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        joined_at:
          type: string
          format: date-time
      required:
      - id
      - email
      - joined_at
      additionalProperties: false
    ResetLink:
      type: object
      properties:
        email:
          type: string
        token:
          type: string
        expires_at:
          type: string
          format: date-time
      required:
      - email
      - token
      - expires_at
      additionalProperties: false
    PasswordReset:
      type: object
      properties:
        email:
          type: string
      required:
      - email
      additionalProperties: false
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        existing_id:
          type: integer
      required:
      - type
      - title
      - status
