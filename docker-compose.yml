# The my-finance stack, defined once, here (ARCHITECTURE.md §5): the database,
# the backend, the plan executor and the frontend, with the three application
# images built from this repository. `docker compose up -d --build` and the app
# is at http://localhost:3000. Every setting has a working default; to change
# one, copy .env.example to .env.
#
# Only the frontend publishes a port, and by default only on this computer
# (MYFINANCE_BIND_ADDRESS): the backend is reached exclusively through nginx's
# /api proxy, postgres only from the backend and analytics, and analytics only
# from the backend (nginx has no route to it).
#
# The explicit project name keeps the data volume's name
# ("my-finance_postgres-data") the same whatever the checkout's folder is called.
name: my-finance

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myfinance}
      POSTGRES_USER: ${POSTGRES_USER:-myfinance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myfinance}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-myfinance}
      DB_USERNAME: ${POSTGRES_USER:-myfinance}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-myfinance}
      ANALYTICS_URL: http://analytics:8000
      DB_ANALYTICS_PASSWORD: ${DB_ANALYTICS_PASSWORD:-myfinance-ro}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # One request for the profile list, on the port that serves the app, expecting 200.
      # It goes through the servlet filters, a controller and a query, so "healthy" means
      # the backend can answer from the database, not merely that a port is open. A read
      # needs no X-Profile-Id header and the list sits above the profile boundary, so an
      # instance with no profiles answers 200 [] too. busybox wget (the alpine JRE image
      # has no curl) exits non-zero on any other status; it runs inside the container, so
      # the port needs no publishing.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/api/profiles"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  analytics:
    build: ./analytics
    restart: unless-stopped
    environment:
      # The read-only myfinance_ro role (docs/SCHEMA.md "The read-only analytics
      # role"), never the app's own credentials.
      DATABASE_URL: postgresql://myfinance_ro:${DB_ANALYTICS_PASSWORD:-myfinance-ro}@postgres:5432/${POSTGRES_DB:-myfinance}
      TZ: ${TZ:-UTC}
    depends_on:
      postgres:
        condition: service_healthy
      # myfinance_ro is created by the backend's Flyway migration, which runs
      # during startup — so "backend healthy" is also "the credential exists".
      # Without this, a first-ever `up` has analytics 503ing every execute until
      # the migration lands. No cycle: the backend calls analytics at runtime but
      # declares no dependency on it, and its healthcheck touches only itself.
      backend:
        condition: service_healthy
    healthcheck:
      # No wget/curl in python:3.12-slim; the interpreter is the probe.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # The host address the one published port listens on. The default 127.0.0.1 is
      # this computer only; 0.0.0.0 is every interface, reachable from the network —
      # and the instance has no sign-in, so whoever can reach it can read and delete
      # everything.
      - "${MYFINANCE_BIND_ADDRESS:-127.0.0.1}:3000:80"

volumes:
  postgres-data:
