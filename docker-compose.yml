# Development entry point (ARCHITECTURE.md §5). The stack is defined once, in
# deploy/release/docker-compose.yml; this file includes it with the development
# layer — docker-compose.dev.yml builds the three app images from source, and
# docker-compose.dev.env supplies the development ANALYTICS_TOKEN the release
# file requires. `docker compose up --build` and the app is at
# http://localhost:3000; `docker compose config` shows the merged stack.
# Needs Docker Compose 2.27 or newer.
include:
  - path:
      - deploy/release/docker-compose.yml
      - docker-compose.dev.yml
    project_directory: .
    env_file: docker-compose.dev.env
