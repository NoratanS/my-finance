# Full self-hosted stack (ARCHITECTURE.md §5). `docker compose up --build`
# and the app is at http://localhost:3000. Only the frontend publishes a
# port — the backend is reached exclusively through nginx's /api proxy,
# postgres only from the backend and analytics, redis only from the backend
# (HTTP session storage), and analytics only from the backend (nginx has no
# route to it).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myfinance}
      POSTGRES_USER: ${POSTGRES_USER:-myfinance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myfinance}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-myfinance}
      DB_USERNAME: ${POSTGRES_USER:-myfinance}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-myfinance}
      REDIS_HOST: redis
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      ANALYTICS_URL: http://analytics:8000
      ANALYTICS_TOKEN: ${ANALYTICS_TOKEN:-dev-analytics-token}
      DB_ANALYTICS_PASSWORD: ${DB_ANALYTICS_PASSWORD:-myfinance-ro}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # busybox wget from the alpine JRE base image (no curl there). Probes BOTH ports;
      # wget runs inside the container, so neither needs publishing to be reached.
      #   8081 — the management port (application.properties: management.server.port=8081):
      #          Spring's own liveness/readiness view of the app.
      #   8080 — the application port, which is the one users actually reach through nginx.
      # The 8080 leg is not redundant: when the management port moved off 8080, this check
      # stopped touching the port that serves traffic, and compose went on reporting the
      # backend healthy through an outage in which every /api request failed. A healthcheck
      # that does not exercise the thing it claims to vouch for is worse than none.
      # /api/auth/me answers 401 unauthenticated, so the 8080 leg asserts that status rather
      # than a 2xx — it proves the filter chain and the dispatcher are live, and because the
      # CSRF token is cookie-based the request creates no session, so probing every 5s
      # cannot leak Redis keys (verified: DBSIZE unchanged across repeated probes).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8081/actuator/health && wget -q -S -O /dev/null http://localhost:8080/api/auth/me 2>&1 | grep -q ' 401 '"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  analytics:
    build: ./analytics
    restart: unless-stopped
    environment:
      # The read-only myfinance_ro role (docs/SCHEMA.md "The read-only analytics
      # role"), never the app's own credentials.
      DATABASE_URL: postgresql://myfinance_ro:${DB_ANALYTICS_PASSWORD:-myfinance-ro}@postgres:5432/${POSTGRES_DB:-myfinance}
      ANALYTICS_TOKEN: ${ANALYTICS_TOKEN:-dev-analytics-token}
      TZ: ${TZ:-UTC}
      # Points at the ai-profile container. Without that profile the name does
      # not resolve, the capabilities probe answers interpret:false, and the
      # explorer stays on templates + chips — the documented degrade path.
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
    depends_on:
      postgres:
        condition: service_healthy
      # myfinance_ro is created by the backend's V4 Flyway migration, which runs
      # during startup — so "backend healthy" is also "the credential exists".
      # Without this, a first-ever `up` has analytics 503ing every execute until
      # the migration lands. No cycle: the backend calls analytics at runtime but
      # declares no dependency on it, and its healthcheck touches only its own ports.
      backend:
        condition: service_healthy
    healthcheck:
      # No wget/curl in python:3.12-slim; the interpreter is the probe.
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/health')\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # Optional local AI (ARCHITECTURE.md section 6, docs/INSIGHTS.md "The AI
  # layer"). Started only by `docker compose --profile ai up`; with the
  # profile off, nothing here is pulled or run and the insights explorer
  # loses free-text search — never a capability.
  ollama:
    profiles: ["ai"]
    image: ollama/ollama:0.33.3
    restart: unless-stopped
    environment:
      # Read by `ollama pull` from inside the container (deploy/release/start.sh
      # --ai), so the model tag has exactly one source of truth: this file.
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
    volumes:
      # The model is gigabytes. A named volume means a restart, or an image
      # upgrade, never re-downloads it.
      - ollama-models:/root/.ollama
    healthcheck:
      # The ollama CLI is in the image and talks to its own API; no wget/curl
      # needed (unlike the backend's alpine JRE base).
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

  # Metrics (ARCHITECTURE.md section 5). Started only by `docker compose --profile
  # observability up`, mirroring how the `ai` profile gates Ollama — with the profile off,
  # neither container is pulled or run and the default stack is unchanged. Scrapes the
  # backend's management port (application.properties: management.server.port=8081), which
  # is never published to the host; loopback-only publishing here (127.0.0.1) keeps both
  # UIs reachable for a human on the machine without handing the backend's metrics, or
  # Prometheus's own query API, to anything else on the LAN.
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:13.2.1
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      # Provisioning as code: the dashboard JSON is committed in the repo, not clicked
      # together by hand (deploy/observability/grafana/dashboards).
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
  redis-data:
  ollama-models:
  prometheus-data:
  grafana-data:
