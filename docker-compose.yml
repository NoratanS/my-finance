# Full self-hosted stack (ARCHITECTURE.md §5). `docker compose up --build`
# and the app is at http://localhost:3000. Only the frontend publishes a
# port — the backend is reached exclusively through nginx's /api proxy, and
# postgres only from the backend.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myfinance}
      POSTGRES_USER: ${POSTGRES_USER:-myfinance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-myfinance}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-myfinance}
      DB_USERNAME: ${POSTGRES_USER:-myfinance}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-myfinance}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # busybox wget from the alpine JRE base image (no curl there).
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres-data:
