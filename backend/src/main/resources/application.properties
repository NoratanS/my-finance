spring.application.name=backend

# --- Database ---
# Defaults target the docker-compose Postgres; override with env vars (SPRING_DATASOURCE_*)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/myfinance}
spring.datasource.username=${DB_USERNAME:myfinance}
spring.datasource.password=${DB_PASSWORD:myfinance}

# Flyway owns the schema (docs/SCHEMA.md); Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- HTTP / JSON (docs/API.md "Cross-cutting decisions") ---
# Money is a decimal string; never emit scientific notation for large amounts.
spring.jackson.write.write-bigdecimal-as-plain=true
# (Jackson 3 already writes java.time values as ISO-8601 strings, not epoch numbers.)
# Query params of type LocalDate bind from ISO-8601 (yyyy-MM-dd) without a per-parameter @DateTimeFormat.
spring.mvc.format.date=iso
# Framework exceptions like 405/415 become RFC 9457 Problem Details too (same shape as GlobalExceptionHandler).
spring.mvc.problemdetails.enabled=true

# --- Session cookie (docs/API.md "Authentication: session cookie") ---
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Secure=true means the cookie is only sent over HTTPS. Left configurable so a
# plain-HTTP localhost setup still works; production behind TLS should set it true.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
# Open question in docs/API.md: 30 min is too short for a finance app left open in a tab.
server.servlet.session.timeout=8h
