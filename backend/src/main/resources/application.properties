spring.application.name=backend

# --- Database ---
# Defaults target the docker-compose Postgres; override with env vars (SPRING_DATASOURCE_*)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/myfinance}
spring.datasource.username=${DB_USERNAME:myfinance}
spring.datasource.password=${DB_PASSWORD:myfinance}

# Flyway owns the schema (docs/SCHEMA.md); Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Pin Hibernate's @JdbcTypeCode(SqlTypes.JSON) mapper to Jackson 3 (Insight.plan/viz are
# tools.jackson.databind.JsonNode). Without this, Hibernate auto-selects classic Jackson 2
# when it's on the classpath (it is, transitively via springdoc/swagger-core) and can no
# longer construct a Jackson-3 JsonNode, breaking every JSON-column read/write.
spring.jpa.properties.hibernate.type.json_format_mapper=jackson3

# --- Analytics read-only role (docs/SCHEMA.md "The read-only analytics role") ---
# The migration creates myfinance_ro with this password; the plan executor connects with it.
# The dev default is load-bearing: tests read this same file, and a placeholder with no
# value fails every migration with Flyway's "No value provided for placeholder".
spring.flyway.placeholders.dbAnalyticsPassword=${DB_ANALYTICS_PASSWORD:myfinance-ro}

# --- Subscription charge job (docs/SCHEMA.md "Charge posting") ---
# Enabled by default; tests set it to false so the daily @Scheduled run can never
# fire mid-test (the job itself is exercised by calling postDueCharges directly).
myfinance.charge-scheduler.enabled=true

# --- HTTP / JSON (docs/API.md "Cross-cutting decisions") ---
# Money is a decimal string; never emit scientific notation for large amounts.
spring.jackson.write.write-bigdecimal-as-plain=true
# (Jackson 3 already writes java.time values as ISO-8601 strings, not epoch numbers.)
# Query params of type LocalDate bind from ISO-8601 (yyyy-MM-dd) without a per-parameter @DateTimeFormat.
spring.mvc.format.date=iso

# --- OpenAPI document (ARCHITECTURE.md "OpenAPI document and the Jackson 2/3 split") ---
# docs/openapi.json is a committed copy of /v3/api-docs that OpenApiDocumentTest compares with the
# served one; sorted keys and pretty-printing keep its diffs down to the actual change.
springdoc.writer-with-order-by-keys=true
springdoc.writer-with-default-pretty-printer=true
# The API only produces JSON; without this every response is documented as */*.
springdoc.default-produces-media-type=application/json

# --- Backup restore upload (docs/API.md "POST /api/backup/restore") ---
# The only upload endpoint; over the limit is 413 /errors/backup-too-large.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
# Tomcat must swallow the rest of an oversized body or it aborts the connection and the
# 413 never reaches the client (default is 2MB); 25MB matches nginx's client_max_body_size.
server.tomcat.max-swallow-size=25MB

# --- Actuator (ARCHITECTURE.md section 5, "Deployment, packaging, and CI/CD") ---
# Health and info; every other endpoint stays unexposed. Management runs on its own port,
# which docker-compose never publishes to the host.
management.endpoints.web.exposure.include=health,info
management.server.port=8081

# --- Analytics service (docs/INSIGHTS.md "The analytics service") ---
# Internal-only service: the compose service name in the shipped stack, localhost when both
# run on a developer's machine. Any connect/read failure becomes 503 /errors/analytics-unavailable.
analytics.base-url=${ANALYTICS_URL:http://localhost:8000}
analytics.connect-timeout=2s
analytics.read-timeout=10s
