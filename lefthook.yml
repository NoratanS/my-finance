pre-commit:
  parallel: true
  jobs:
    - name: prettier
      # lefthook's ** requires at least one directory in between, so it
      # won't match files directly in src/ or e2e/ (e.g. src/App.tsx,
      # e2e/smoke.spec.ts) on its own — the second pattern covers those.
      glob:
        - "frontend/{src,e2e}/**/*.{ts,tsx,css,json}"
        - "frontend/{src,e2e}/*.{ts,tsx,css,json}"
      root: "frontend/"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    - name: ruff-format
      glob: "analytics/**/*.py"
      root: "analytics/"
      run: uv run ruff format {staged_files}
      stage_fixed: true
    - name: spotless
      glob: "backend/**/*.java"
      root: "backend/"
      run: ./mvnw -q spotless:apply
      stage_fixed: true
